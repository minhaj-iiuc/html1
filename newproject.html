<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4; 
        }

        nav {
            background-color: #222;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center; 
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold; 
        }

        ul {
            list-style: none; 
            display: flex;
            gap: 20px;
        }

        ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        ul li a:hover {
            color: #f5c518;
        }

        .auth-menu {
            background-color: #333;
            margin: 20px;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
        }
        
        .auth-menu .logo {
            margin-bottom: 15px; 
        }

       
        .my-btn {
            font-family: sans-serif;
            font-weight: bold;
            font-size: 1rem;
            padding: 1rem 2rem;
            border-radius: 6px;
            border: none;
            background-color: #f5c518;
            color: #1b1818;
            cursor: pointer;
            margin: 20px;
        }
        
        .my-btn:hover {
            background-color: #e0b416;
        }
    </style>
</head>

<body>
   <form onsubmit="return false">
    <div class="form-item">
        <label >Username</label>
    <div class="input-wrapper">
        <input type="text" id="username" placeholder="Enter your username"</div> 
    </div>
    <div class="form-item">
        <label>Password</label>
        <div class="input-wrapper">
            <input type="password" id="password" placeholder="please enter your password" autocomplete="off">
        <button type="button" id="togglePassword">Show</button>
   <div class="eye"></div>
   </button>
        <div id="beam"></div>
        </div>
    </div>
    <button id="submit">sign in</button>
    </form>
    <nav>
        <div class="logo">My Website</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </nav>


    <div class="auth-menu">
        <div class="logo">User Portal</div>
        <ul>
            <li><a href="#">Login</a></li>
            <li><a href="#">Create Account</a></li>
            <li><a href="#">Forget Password</a></li>
            <li><a href="#">Help</a></li>
        </ul>
    </div>


    <button class="my-btn">Click Here</button>

</body>

</html>
